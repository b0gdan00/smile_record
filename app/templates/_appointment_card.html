<button class="appointment-card w-full rounded-lg border border-slate-200 p-4 text-left" data-appointment-id="{{ item.id }}">
  <div class="flex items-start justify-between gap-3">
    <div>
      <p class="text-sm font-semibold">{{ item.date }} · {{ item.time }} · {{ item.duration_minutes }} хв</p>
      <h2 class="mt-1 text-lg font-semibold">{{ item.patient_name }}</h2>
    </div>
    <span class="rounded-md px-2 py-1 text-xs font-medium {{ item.status_badge_class }}">{{ item.status_label }}</span>
  </div>
  <p class="mt-2 text-sm">{{ item.doctor_name }}</p>
  <p class="mt-1 text-sm">{{ item.service_name or item.reason or "Без причини візиту" }}</p>
</button>
