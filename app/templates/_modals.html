<div id="quickActionsModal" class="modal fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/70 p-4 sm:items-center">
  <div class="w-full max-w-md rounded-lg bg-slate-50 p-4 shadow-xl">
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-lg font-semibold">Швидко додати</h2>
      <button data-close-modal class="rounded-md px-2 py-1" aria-label="Закрити">×</button>
    </div>
    <div class="grid gap-2">
      <button data-open-modal="appointmentModal" data-close-parent class="rounded-md bg-slate-900 px-4 py-3 text-left font-medium text-slate-50">Новий запис</button>
      <button data-open-modal="patientModal" data-close-parent class="rounded-md border border-slate-200 px-4 py-3 text-left font-medium">Новий пацієнт</button>
      <button data-open-modal="doctorModal" data-close-parent class="rounded-md border border-slate-200 px-4 py-3 text-left font-medium">Новий лікар</button>
    </div>
  </div>
</div>

<datalist id="servicesDatalist">
  {% for service in services %}
    <option value="{{ service.name }}"></option>
  {% endfor %}
</datalist>

<div id="patientModal" class="modal fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/70 p-4 sm:items-center">
  <div class="max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-lg bg-slate-50 p-5 shadow-xl">
    <div class="mb-5 flex items-center justify-between">
      <h2 class="text-xl font-semibold">Новий пацієнт</h2>
      <button data-close-modal class="rounded-md px-2 py-1" aria-label="Закрити">×</button>
    </div>
    <form id="patientForm" class="space-y-4">
      <label class="block">
        <span class="text-sm font-medium">ПІБ</span>
        <input name="full_name" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Телефон</span>
        <input name="phone" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Дата народження</span>
        <input name="birth_date" type="date" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Нотатки</span>
        <textarea name="notes" rows="3" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900"></textarea>
      </label>
      <p data-form-message class="hidden text-sm"></p>
      <button class="w-full rounded-md bg-slate-900 px-4 py-3 font-medium text-slate-50">Зберегти</button>
    </form>
  </div>
</div>

<div id="doctorModal" class="modal fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/70 p-4 sm:items-center">
  <div class="max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-lg bg-slate-50 p-5 shadow-xl">
    <div class="mb-5 flex items-center justify-between">
      <h2 id="doctorModalTitle" class="text-xl font-semibold">Новий лікар</h2>
      <button data-close-modal class="rounded-md px-2 py-1" aria-label="Закрити">×</button>
    </div>
    <form id="doctorForm" class="space-y-4">
      <input type="hidden" name="doctor_id">
      <label class="block">
        <span class="text-sm font-medium">ПІБ</span>
        <input name="full_name" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Телефон</span>
        <input name="phone" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Нотатки</span>
        <textarea name="notes" rows="3" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900"></textarea>
      </label>
      <label class="flex items-center gap-2 text-sm font-medium">
        <input name="active" type="checkbox" checked class="h-4 w-4 rounded border-slate-200 text-slate-900 focus:ring-slate-900">
        Активний лікар
      </label>
      <p data-form-message class="hidden text-sm"></p>
      <button class="w-full rounded-md bg-slate-900 px-4 py-3 font-medium text-slate-50">Зберегти</button>
    </form>
  </div>
</div>

<div id="appointmentModal" class="modal fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/70 p-4 sm:items-center">
  <div class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-lg bg-slate-50 p-5 shadow-xl">
    <div class="mb-5 flex items-center justify-between">
      <h2 class="text-xl font-semibold">Новий запис</h2>
      <button data-close-modal class="rounded-md px-2 py-1" aria-label="Закрити">×</button>
    </div>
    <form id="appointmentForm" class="space-y-4">
      <input type="hidden" name="patient_id">
      <div class="relative">
        <label class="block">
          <span class="text-sm font-medium">Пацієнт</span>
          <input id="patientAutocomplete" autocomplete="off" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900" placeholder="ПІБ або телефон">
        </label>
        <div id="patientSuggestions" class="absolute z-10 mt-1 hidden w-full rounded-md border border-slate-200 bg-slate-50 shadow-lg"></div>
      </div>
      <div class="grid gap-4 sm:grid-cols-3">
        <label class="block">
          <span class="text-sm font-medium">Дата</span>
          <input name="date" type="date" value="{{ today }}" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
        </label>
        <label class="block">
          <span class="text-sm font-medium">Час</span>
          <input name="time" type="time" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
        </label>
        <label class="block">
          <span class="text-sm font-medium">Лікар</span>
          <select name="doctor_id" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
            {% for doctor in doctors %}
              <option value="{{ doctor.id }}">{{ doctor.full_name }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <label class="block">
        <span class="text-sm font-medium">Послуга</span>
        <input name="service_name" list="servicesDatalist" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900" placeholder="Оберіть або введіть нову">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Коментар до візиту</span>
        <input name="reason" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Коментар</span>
        <textarea name="comments" rows="3" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900"></textarea>
      </label>
      <p data-form-message class="hidden text-sm"></p>
      <button class="w-full rounded-md bg-slate-900 px-4 py-3 font-medium text-slate-50">Створити запис</button>
    </form>
  </div>
</div>

<div id="detailModal" class="modal fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/70 p-4 sm:items-center">
  <div class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-lg bg-slate-50 p-5 shadow-xl">
    <div class="mb-5 flex items-start justify-between gap-4">
      <div>
        <p id="detailMeta" class="text-sm font-medium"></p>
        <h2 id="detailTitle" class="text-xl font-semibold"></h2>
      </div>
      <button data-close-modal class="rounded-md px-2 py-1" aria-label="Закрити">×</button>
    </div>
    <form id="detailForm" class="space-y-4">
      <input type="hidden" name="appointment_id">
      <div class="grid gap-4 sm:grid-cols-3">
        <label class="block">
          <span class="text-sm font-medium">Дата</span>
          <input name="date" type="date" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
        </label>
        <label class="block">
          <span class="text-sm font-medium">Час</span>
          <input name="time" type="time" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
        </label>
        <label class="block">
          <span class="text-sm font-medium">Лікар</span>
          <select name="doctor_id" required class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
            {% for doctor in doctors %}
              <option value="{{ doctor.id }}">{{ doctor.full_name }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <label class="block">
        <span class="text-sm font-medium">Статус</span>
        <select name="status" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
          {% for key, label in status_labels.items() %}
            <option value="{{ key }}">{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <div class="grid gap-2 sm:grid-cols-3">
        <button type="button" class="close-status rounded-md bg-red-600 px-3 py-2 text-sm font-medium text-slate-50" data-status="cancelled">Відмінили запис</button>
        <button type="button" class="close-status rounded-md bg-green-600 px-3 py-2 text-sm font-medium text-slate-50" data-status="attended">Проведено</button>
        <button type="button" class="close-status rounded-md bg-orange-500 px-3 py-2 text-sm font-medium text-slate-900" data-status="missed">Не прийшли</button>
      </div>
      <div class="rounded-md border border-slate-200 p-3 text-sm">
        <p id="detailPatientInfo"></p>
        <p id="detailLastVisit" class="mt-1"></p>
      </div>
      <label class="block">
        <span class="text-sm font-medium">Послуга</span>
        <input name="service_name" list="servicesDatalist" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900" placeholder="Оберіть або введіть нову">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Коментар до візиту</span>
        <input name="reason" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900">
      </label>
      <label class="block">
        <span class="text-sm font-medium">Коментарі реєстратури</span>
        <textarea name="comments" rows="3" class="mt-1 w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 outline-none focus:border-slate-900"></textarea>
      </label>
      <p data-form-message class="hidden text-sm"></p>
      <button class="w-full rounded-md bg-slate-900 px-4 py-3 font-medium text-slate-50">Зберегти деталі</button>
    </form>
  </div>
</div>
